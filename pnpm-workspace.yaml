packages:
  - apps/*
allowBuilds:
  '@google/genai': false
  '@parcel/watcher': true
  '@swc/core': true
  better-sqlite3: true
  electron: true
  electron-winstaller: false
  esbuild: true
  koffi: false # 仅 libreoffice-kit 的 Windows CLI 路径引用,darwin 运行时不加载,无需构建脚本
  protobufjs: false
minimumReleaseAgeExclude:
  - '@earendil-works/pi-agent-core@1.5.0 || 1.5.2'
  - '@earendil-works/pi-ai@1.5.0 || 1.5.2'
  - '@earendil-works/pi-codemode@1.5.0 || 1.5.2'
  - '@earendil-works/pi-coding-agent@1.5.0 || 1.5.2'
  - '@earendil-works/pi-mcp@1.5.0 || 1.5.2'
  - '@earendil-works/pi-schema@1.5.0 || 1.5.2'
  - '@earendil-works/pi-telemetry@1.5.0 || 1.5.2'
  - '@earendil-works/pi-tui@1.5.0 || 1.5.2'
  - 'docx@9.15.2'
