# 发版流水线:推 v* tag → macos-latest(arm64)构建 DMG/ZIP → electron-builder 发布 GitHub Release。
# 客户端自动更新(app-update.ts)从本仓库 Releases latest 发现版本并下载 PiWork-<version>-arm64.dmg。
# 发版步骤:bump apps/desktop/package.json 的 version → 提交 → 打同名 vX.Y.Z tag → push tag。
name: release
on:
  push:
    tags:
      - 'v*'

# GITHUB_TOKEN 默认只读;electron-builder 需要创建 Release 并上传资产
permissions:
  contents: write

jobs:
  release-mac:
    runs-on: macos-latest
    # GitHub macOS runner 镜像自带 ELECTRON_SKIP_BINARY_DOWNLOAD=1,会让 electron 的
    # postinstall 跳过二进制下载,而 licenses:collect 与打包都需要
    # node_modules/electron/dist;置空覆盖(空字符串在 electron install.js 中为假值)。
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: ''
    steps:
      - uses: actions/checkout@v4
      # pnpm 版本取根 package.json 的 packageManager 字段
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Verify tag matches package version
        run: |
          VERSION="v$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match apps/desktop/package.json version ${VERSION}" >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      # 兜底:若 install 阶段 electron 二进制仍缺失(跳过变量未被覆盖等),显式补一次
      - name: Ensure Electron binary is downloaded
        run: |
          if [ ! -d apps/desktop/node_modules/electron/dist ]; then
            node apps/desktop/node_modules/electron/install.js
          fi
      # better-sqlite3 等原生模块按 Electron ABI 重编(与本地 rebuild:electron 同步骤)
      - name: Rebuild native modules for Electron
        run: pnpm --dir apps/desktop exec electron-builder install-app-deps
      - name: Build and publish GitHub Release
        run: pnpm --dir apps/desktop release:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
